<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes a1{from{transform: translateY(-200px);opacity: 1;} to{transform: translatey(200px);opacity: 0;}}
        .a{height: 100px;width: 100px;border-radius: 50%;top:200px;left:100px;background-color: cadetblue;animation: a1 3s ease 0s infinite alternate;position: relative;}
        @keyframes a11{from{transform: translateY(-200px);opacity: 1;} to{transform: translatey(200px);opacity: 0;}}
        .a11{height: 100px;width: 100px;border-radius: 50%;top:200px;left:200px;background-color: cadetblue;animation: a11 3s ease 1.5s infinite alternate;position: relative;}
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="a11"></div>
</body>
</html>
