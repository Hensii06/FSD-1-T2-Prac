<html>
<head>
<style>
.box
{
background-color:lightblue;
border:2px solid navy;
text-align:center;
}
.inline div
{
display:inline;
background-color:yellow;
border:1px solid orange;
padding:5px
}

.block span
{
display:block;
background-color:lightpurple;
border:1px solid red;
padding:10px;
margin-bottom:5px;
color:purple;
}
.inline-block div
{
display:inline-block;
background-color:pink;
border:2px solid orange;
padding:5px;
width:120px;
height:60px;
line-height:60px;
margin:50px
}
.none p
{
display:none;
}
</style>
<body>
<div class="inline box">
<div> Inline 1 </div>
<div> Inline 2 </div>
<div> Inline 3 </div>
</div>
<div class="block box">
<span> block 1</span>
<span> block 1</span>
<span> block 1</span>
</div>
<div class="inline-block box">
<div> Inline and block 1 </div>
<div> Inline and block 2 </div>
<div> Inline and block 3 </div>
</div>
<div class="none box">
<p>Hidden</p>
</div>
</body>
