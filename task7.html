<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .h{background-image: linear-gradient(to right,red,yellow,green,blue,violet);text-align: center;color: white;}
        .h1{background-clip: text;color: transparent;background-image: linear-gradient(20deg,red,blue,yellow,#dc143c);font-size: 100px;text-align: center;}
        .h2{background-image: linear-gradient(to right,lightgreen,lightblue);background-size: 300%;background-position: left;transition: background-position 3s;height: 200px;width: 200px;}
        .h2:hover{background-position:right;}
        @keyframes a1{0%{background-position: left;} 50%{background-position: right;} 100%{background-position: left;}}
        .h3{background-clip:text;background-image: linear-gradient(to right,green,blue);background-size: 300%;background-position: left;transition: background-position 3s;animation:a1 3s infinite ;color: transparent;font-size: 100px;}
    </style>
</head>
<body>
    <h1 class="h">RAINBOW</h1>
    <div class="h1">FSD</div>
    <div class="h2"></div>
    <div class="h3">hsgsdsgdfhs</div>

</body>
</html>
