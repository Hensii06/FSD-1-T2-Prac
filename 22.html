<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{background-image: linear-gradient(red,blue,green);height: 100px;width: 200px;margin: 10px;}
        .div2{background-image: linear-gradient(to right,red 10%,blue,green);height: 100px;width: 200px;margin: 10px;}
        .div3{background-image: linear-gradient(to left,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div4{background-image: linear-gradient(to top,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div5{background-image: linear-gradient(to bottom,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div6{background-image: linear-gradient(to top right,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div7{background-image: linear-gradient(to top left,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div8{background-image: linear-gradient(to bottom right,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div9{background-image: linear-gradient(to bottom left,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div10{background-image: linear-gradient(45deg,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div11{background-image: linear-gradient(-90deg,red,blue);height: 100px;width: 200px;margin: 10px;}
        .div12{background-image: radial-gradient(red,blue,green);height: 200px;width: 200px;margin: 10px;}
        .div13{background-image: radial-gradient(circle,red,blue,green);height: 200px;width: 200px;margin: 10px;}
        .div14{background-image: conic-gradient(red,blue,green);height: 200px;width: 200px;}
        .div15{background-image: conic-gradient(red,blue,green,red);height: 200px;width: 200px;margin: 10px;}
        .div16{background-image: conic-gradient(red 45deg,blue 90deg,green 270deg);height: 200px;width: 200px;margin: 10px;}
        .div17{background-image: conic-gradient(red 45deg 90deg,blue 90deg 180deg,green 270deg 360deg);height: 200px;width: 200px;margin: 10px;}

    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <div class="div3"></div>
    <div class="div4"></div>
    <div class="div5"></div>
    <div class="div6"></div>
    <div class="div7"></div>
    <div class="div8"></div>
    <div class="div9"></div>
    <div class="div10"></div>
    <div class="div11"></div>
    <div class="div12"></div>
    <div class="div13"></div>
    <div class="div14"></div>
    <div class="div15"></div>
    <div class="div16"></div>
    <div class="div17"></div>
</body>
</html>
