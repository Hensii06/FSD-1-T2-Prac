<html>
<head>
<title> animation </title>
<style>
form
{
display:block;
margin:20px auto;
width:250px;
padding:20px;
box-shadow: 0 0 10px black;
text-align:center;
}
input
{
background-color:pink;
color:blue;
border-style:dotted;
border-color:yellow;
padding:5px
}
input:hover
{
background-color:Thistle;
color:red;
border-style:dashed;
border-color:yellow;
transition: all 2s ease-in
}
button
{
background-color:red;
color:blue;
padding:5px;
border-width:2px;
}
button:hover
{
background-color:yellow;
color:pink;
padding:5px;
border-width:5px;
transition: all 0.5 ease-in
}
</style>
</head>
<body>
<form>
<fieldset>
<input type="text" name="uname" id ="uname">
<br>
<br>
<button type="submit"> Click me </button>
</fieldset>
</body>
</html>
