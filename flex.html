<html>
<head>
<style>
.container
{
display:flex;
flex-direction:column-reverse;
justify-content:space-evenly;
align-items:center;
flex-wrap:wrap;
gap:15px;
background-color:grey;
padding:15px;
}
.items
{
background-color:lightblue;
color:white;
padding:20px;
text-align:center;
border-radius:5px;
width:200px
}
.items:nth-child(2)
{
order:1;
background-color:orange;
}
</style>
</head>
<body>
<div class="container">
<div class="items"> Item 1 </div>
<div class="items"> Item 2 </div>
<div class="items"> Item 3 </div>
</div>
</body>
</html>
