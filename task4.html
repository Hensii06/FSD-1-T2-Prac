<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{background-color: aqua;height: 100px;width: 200px;margin: 10px;float: left;}
        .a:hover{background-color: brown;transform: rotate(50deg);}
        .b:hover{background-color: brown;transform: rotateX(180deg);}
        .c:hover{background-color: brown;transform: rotateY(180deg);}
        .d:hover{background-color: brown;transform:skew(20deg,40deg);}
        .e:hover{background-color: brown;transform: scale(2,0.5);}
        .f:hover{background-color: brown;transform: scaleX(2);}
        .g:hover{background-color: brown;transform: scaleY(2);}
        .h:hover{background-color: brown;transform: translate(50px,100px);}
        .i:hover{background-color: brown;transform: skewX(30deg);}
        .j:hover{background-color: brown;transform: skewY(30deg);}
        .x:hover{background-color: blue;transform: translate(200px,50px) rotate(50deg) scale(2,0.5) skewX(30deg);}
    </style>
</head>
<body>
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
    <div class="d"></div>
    <div class="e"></div>
    <div class="f"></div>
    <div class="g"></div>
    <div class="h"></div>
    <div class="i"></div>
    <div class="j"></div>
    <div class="x" style="background-color: crimson;"></div>
</body>
</html>
