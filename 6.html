<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a1{height: 300px;width: 300px;border: 2px solid black;margin: 20px;padding:40px;box-sizing: border-box;background-color: teal;color: white;text-align: center;}
    </style>
</head>
<body>
    <p style="margin: auto;border: 1px solid blue;text-align: center;">I am P1</p>
    <p style="margin: 10px;padding: 10px;border: 1px dotted green;text-align: center;">I am P2</p>
    <p style="margin: 100px;padding: 50px 100px;border: 1px dashed red;text-align: center;">I am P3</p>
    <div class="a1">
        <p>check box-sizing<br>
        change value and observe</p>
    </div>
</body>
</html>
