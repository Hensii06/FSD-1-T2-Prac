<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{color: green;}
        a:visited{color:red ;}
        a:hover{color:blue ;}
        a:active{color: yellow;}
        input:focus{background-color: pink;}
        ul li:nth-child(2){color:red}
        ul li:not(.a){background-color: cyan;}
        input[type="checkbox"]:checked+label{color: red;}
    
    </style>
</head>
<body>
    <a href="http://www.google.com" target="_blank">Check Me</a>
    <form>
        Name:<input type="text"/>
        <input type="checkbox">
        <label>HTML</label>
    </form>
    <ul>
        <li>abd</li>
        <li>sdf</li>
        <li class="a">asd</li>
        <li>mbn</li>
    </ul>
</body>
</html>
