<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes animate1{0%{background-color:red;top: 0px;left:0px;border-radius: 0%;} 25%{background-color: yellow;top: 0px;left:600px;border-radius: 50%;} 50%{background-color: green;top: 600px;left:600px;border-radius: 0%;} 75%{background-color: blue;top: 600px;left: 0px;border-radius: 50%;} 100%{background-color: red;top: 0px;left: 0px;border-radius: 0%;}}
        .abc11{height: 200px;width: 200px;background-color:red;animation-name: animate1;animation-duration: 10s;animation-delay: 0s;animation-timing-function: ease;animation-iteration-count: infinite; position:relative ;}
        @keyframes a1{0%{background-color: red;top:0px;left:0px;border-radius: 0%;} 50%{background-color: green;top:300px;left: 300px;border-radius: 50%;transform: rotate(1000deg);} 100%{background-color: red;top:0px;left:600px;transform: rotate(-1000deg);}}
        .abc111{height: 200px;width: 200px;background-color:red;animation-name: a1;animation-duration: 10s;animation-delay: 0s;animation-timing-function: ease;animation-iteration-count: infinite; position:relative ;}
        @keyframes a2{0%{top: -0px;left: 0px;} 50%{top: 0px;left: 1000px;} 100%{top: 0px;left: 0px;}}
        .a2{color: red;animation-name: a2;animation-duration: 5s;animation-delay: 0s;animation-timing-function: ease;animation-iteration-count: infinite; position:relative ;}
    </style>
</head>
<body>
    <div class="abc11"></div>
    <div class="abc111"></div>
    <h1 class="a2">adc</h1>
</body>
</html>
