<html>
<head>
<style>
.box1
{
width:300px;
height:150px;
padding:20px;
margin:30px auto;
border:4px solid red;
box-sizing: content-box;
box-shadow:5px 5px 15px grey;
background-color:lightyellow;
text-align:center
}
.box2
{
width:300px;
height:150px;
padding:20px;
margin:30px auto;
border:4px solid red;
box-sizing:border-box;
box-shadow:5px 5px 15px grey;
background-color:lightpink;
text-align:center
}
</style>
<body>
<div class="box1">
box1-box-sizing: content-box
<br>
width height include only content-box
</div>
<div class="box2">
box2-box-sizing: content-box
<br>
width height include only content-box
</div>
</body>
</html>
